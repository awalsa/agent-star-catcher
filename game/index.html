<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Catcher — built by an AI agent from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1026; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
  h1 { font-size: 20px; margin: 12px 0 4px; letter-spacing: 2px; }
  h1 span { color: #ffd23f; }
  p.sub { margin: 0 0 10px; color: #9aa3c7; font-size: 14px; }
  p.sub b { color: #22d3ee; }
  #wrap { position: relative; width: min(960px, 96vw); }
  canvas { width: 100%; display: block; border-radius: 12px;
           box-shadow: 0 0 0 2px #1e2a52, 0 0 60px rgba(230, 0, 126, .25); background: #0b1026; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
             align-items: center; justify-content: center; text-align: center;
             background: rgba(11, 16, 38, .82); border-radius: 12px; cursor: pointer; }
  #overlay h2 { font-size: 42px; margin: 0 0 8px; color: #ffd23f; }
  #overlay p { margin: 4px 0; color: #dfe4ff; font-size: 17px; }
  #overlay .cta { margin-top: 14px; padding: 10px 22px; border-radius: 999px;
                 background: #e6007e; color: #fff; font-weight: 700; font-size: 16px; }
  .hidden { display: none !important; }
  footer { margin-top: 10px; color: #9aa3c7; font-size: 13px; }
  footer a { color: #22d3ee; }
</style>
</head>
<body>
<h1>STAR <span>CATCHER</span></h1>
<p class="sub">Catch the falling stars. Move with <b>&larr; &rarr;</b> / <b>A D</b> or drag. 60 seconds — 15 stars wins.</p>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="overlay">
    <h2 id="ov-title">STAR CATCHER</h2>
    <p id="ov-text">One prompt. One game. Built by an AI agent.</p>
    <div class="cta" id="ov-cta">▶ &nbsp;Play</div>
  </div>
</div>
<footer>Built by an AI agent from one prompt for <a href="https://make.fun">make.fun</a> — come build on make.fun.</footer>
<script>
"use strict";
// Star Catcher: a tiny browser game. Catch falling stars with the basket.
// Controls: ArrowLeft/ArrowRight or A/D keys, mouse/touch drag. 60s, 15 stars wins.
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const GROUND_Y = H - 56;
const BASKET_W = 120, BASKET_H = 22;
const GAME_SECONDS = 60, WIN_SCORE = 15;

const state = {
  running: false, over: false, won: false,
  score: 0, timeLeft: GAME_SECONDS,
  basketX: W / 2 - BASKET_W / 2,
  targetX: null, keys: {},
  stars: [], sparkles: [], lastSpawn: 0, elapsed: 0,
};

function spawnStar() {
  // A star falls from a random x; speed grows slightly as the score grows.
  const speed = 170 + Math.random() * 90 + state.score * 6;
  state.stars.push({
    x: 30 + Math.random() * (W - 60),
    y: -24, r: 13 + Math.random() * 5,
    vy: speed, rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 2.4,
  });
}

function drawStar(x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = "#ffd23f";
  ctx.shadowColor = "#ffd23f";
  ctx.shadowBlur = 18;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 === 0 ? r : r * 0.45;
    const a = (i * Math.PI) / 5 - Math.PI / 2;
    ctx[i === 0 ? "moveTo" : "lineTo"](Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBackground() {
  ctx.fillStyle = "#0b1026";
  ctx.fillRect(0, 0, W, H);
  // faint background stars
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  for (let i = 0; i < 40; i++) {
    const x = (i * 173) % W, y = (i * 97) % (GROUND_Y - 40) + 10;
    ctx.fillRect(x, y, 2, 2);
  }
  // ground line
  ctx.fillStyle = "#1e2a52";
  ctx.fillRect(0, GROUND_Y + BASKET_H + 8, W, 4);
}

function drawBasket() {
  const x = state.basketX, y = GROUND_Y;
  ctx.fillStyle = "#22d3ee";
  ctx.shadowColor = "#22d3ee";
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.roundRect(x, y, BASKET_W, BASKET_H, 10);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#e6007e";
  ctx.fillRect(x + 8, y + 4, BASKET_W - 16, 4);
}

function drawHud() {
  ctx.fillStyle = "#fff";
  ctx.font = "700 28px system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("★ " + state.score, 18, 40);
  ctx.textAlign = "right";
  ctx.fillText("⏱ " + Math.ceil(state.timeLeft) + "s", W - 18, 40);
  ctx.textAlign = "center";
  ctx.fillStyle = "#9aa3c7";
  ctx.font = "16px system-ui, sans-serif";
  ctx.fillText("first to " + WIN_SCORE + " stars wins", W / 2, 40);
}

function burst(x, y) {
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    state.sparkles.push({ x, y, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140 - 40, life: 0.5 });
  }
}

let lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min((t - lastT) / 1000 || 0, 0.05);
  lastT = t;
  if (!state.running) { drawBackground(); drawBasket(); drawHud(); return; }

  state.elapsed += dt;
  state.timeLeft = Math.max(0, GAME_SECONDS - state.elapsed);

  // basket movement: keys or pointer target
  const speed = 520;
  if (state.keys["ArrowLeft"] || state.keys["a"]) state.basketX -= speed * dt;
  if (state.keys["ArrowRight"] || state.keys["d"]) state.basketX += speed * dt;
  if (state.targetX !== null) {
    const want = state.targetX - BASKET_W / 2;
    const dx = want - state.basketX;
    state.basketX += Math.max(-speed * dt, Math.min(speed * dt, dx));
    if (Math.abs(dx) < 2) state.targetX = null;
  }
  state.basketX = Math.max(8, Math.min(W - BASKET_W - 8, state.basketX));

  // spawn a star about every 0.55s
  if (t - state.lastSpawn > 550) { spawnStar(); state.lastSpawn = t; }

  // move stars, catch or miss
  const basketCx = state.basketX + BASKET_W / 2;
  for (let i = state.stars.length - 1; i >= 0; i--) {
    const s = state.stars[i];
    s.y += s.vy * dt;
    s.rot += s.vr * dt;
    if (s.y >= GROUND_Y - 6 && s.y <= GROUND_Y + BASKET_H + 10 &&
        Math.abs(s.x - basketCx) < BASKET_W / 2 + s.r) {
      state.score++;
      burst(s.x, GROUND_Y);
      state.stars.splice(i, 1);
      if (state.score >= WIN_SCORE) return endGame(true);
    } else if (s.y > H + 30) {
      state.stars.splice(i, 1);
    }
  }
  for (let i = state.sparkles.length - 1; i >= 0; i--) {
    const p = state.sparkles[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
    if (p.life <= 0) state.sparkles.splice(i, 1);
  }
  if (state.timeLeft <= 0) return endGame(state.score >= WIN_SCORE);

  drawBackground();
  for (const s of state.stars) drawStar(s.x, s.y, s.r, s.rot);
  for (const p of state.sparkles) {
    ctx.fillStyle = "rgba(255,210,63," + Math.max(0, p.life * 2) + ")";
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
  }
  drawBasket();
  drawHud();
}

function endGame(won) {
  state.running = false;
  state.over = true;
  state.won = won;
  const ov = document.getElementById("overlay");
  document.getElementById("ov-title").textContent = won ? "★ YOU WIN! ★" : "TIME UP!";
  document.getElementById("ov-text").textContent =
    "You caught " + state.score + " star" + (state.score === 1 ? "" : "s") +
    (won ? " — 15 stars in " + state.elapsed.toFixed(1) + "s!" : ". 15 wins — try again!");
  document.getElementById("ov-cta").textContent = "↻  Play again";
  ov.classList.remove("hidden");
}

function startGame() {
  state.running = true; state.over = false;
  state.score = 0; state.elapsed = 0; state.timeLeft = GAME_SECONDS;
  state.stars = []; state.sparkles = [];
  state.basketX = W / 2 - BASKET_W / 2; state.targetX = null;
  state.lastSpawn = performance.now();
  document.getElementById("overlay").classList.add("hidden");
}

document.getElementById("overlay").addEventListener("click", startGame);
window.addEventListener("keydown", (e) => {
  state.keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
  if (["ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
  if ((e.key === "Enter" || e.key === " ") && !state.running) startGame();
});
window.addEventListener("keyup", (e) => {
  state.keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false;
});
function pointerToX(clientX) {
  const r = canvas.getBoundingClientRect();
  return ((clientX - r.left) / r.width) * W;
}
canvas.addEventListener("pointerdown", (e) => { state.targetX = pointerToX(e.clientX); });
canvas.addEventListener("pointermove", (e) => { if (e.buttons) state.targetX = pointerToX(e.clientX); });

drawBackground();
drawBasket();
drawHud();
requestAnimationFrame(frame);
</script>
</body>
</html>
